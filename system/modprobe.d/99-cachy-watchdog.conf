# Cachy-Void — hardware-watchdog blacklist (architecture.md §3.3).
# Provenance: CachyOS-Settings usr/lib/modprobe.d/blacklist.conf (verified
# 2026-08-15). A hardware watchdog nobody arms is pure periodic-timer overhead
# on a gaming box (iTCO_wdt was found LOADED on the reference laptop). The
# software half of this decision is kernel.nmi_watchdog=0 in §3.1.
blacklist iTCO_wdt
blacklist sp5100_tco
