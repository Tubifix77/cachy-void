# Cachy-Void — modern amdgpu driver for GCN 1.0/2.x (architecture.md §3.3).
# Provenance: CachyOS-Settings usr/lib/modprobe.d/amdgpu.conf (verified
# 2026-08-16), verbatim. Forces the modern `amdgpu` driver (Vulkan/RADV-capable)
# over the legacy `radeon` driver on Southern Islands (GCN 1.0) and Sea Islands
# (GCN 2.x) cards. Inert on non-AMD machines. Honesty note: shipped untested on
# real AMD hardware (the reference box is NVIDIA) — verbatim adoption of
# CachyOS's known-good file is the mitigation.
options amdgpu si_support=1 cik_support=1
options radeon si_support=0 cik_support=0
