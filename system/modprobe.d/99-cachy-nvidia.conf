# Cachy-Void — NVIDIA dynamic power management (architecture.md §3.3).
# Provenance: CachyOS-Settings usr/lib/modprobe.d/nvidia.conf (verified
# 2026-08-16). NVreg_DynamicPowerManagement=0x02 lets a Turing-or-newer MOBILE
# dGPU power fully down while idle; the option is accepted-but-inert on older
# generations and desktops (drivers >= 435 know it).
#
# CachyOS's sibling option NVreg_InitializeSystemMemoryAllocations=0 (skip
# zeroing memory handed to the GPU — perf at an explicit security cost, their
# own comment says so) is deliberately NOT shipped; see architecture.md §3.1
# "Deliberate omissions".
options nvidia NVreg_DynamicPowerManagement=0x02
