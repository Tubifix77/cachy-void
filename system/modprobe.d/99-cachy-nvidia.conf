# Cachy-Void — NVIDIA module options (architecture.md §3.3).
# Provenance: CachyOS-Settings usr/lib/modprobe.d/nvidia.conf (verified
# 2026-08-16), now adopted in full:
#
# NVreg_DynamicPowerManagement=0x02 — lets a Turing-or-newer MOBILE dGPU power
# fully down while idle; accepted-but-inert on older generations and desktops
# (drivers >= 435 know it).
#
# NVreg_InitializeSystemMemoryAllocations=0 — skip zeroing system memory before
# handing it to the GPU. Performance at an explicit security cost (stale memory
# contents can be visible to GPU workloads). Codified project stance (owner
# decision, 2026-08-17): when performance and hardening trade off, this overlay
# picks performance — same principle that keeps kptr_restrict=2 OUT puts this
# one IN. Revert per-box by overriding with =1 in a later modprobe.d file.
options nvidia NVreg_DynamicPowerManagement=0x02 \
    NVreg_InitializeSystemMemoryAllocations=0
