# Cachy-Void — vkBasalt default config (architecture.md §3.4).
# Restrained on purpose: ONE effect (CAS sharpening), no reshade chains, no
# kitchen sink of every available filter — same "one clear addition" ethos as
# the rest of the gaming layer. CAS is what branding.md/architecture.md already
# describe pairing with gamescope's FSR upscaling.
#
# Provenance: syntax verified against the upstream project's own example
# (DadSchoorse/vkBasalt config/vkBasalt.conf), 2026-08-16. Search order (their
# README): $VKBASALT_CONFIG_FILE > ./vkBasalt.conf (game's cwd) >
# $XDG_CONFIG_HOME/vkBasalt/vkBasalt.conf > $XDG_DATA_HOME/vkBasalt/... >
# /etc/vkBasalt.conf > /etc/vkBasalt/vkBasalt.conf > /usr/share/vkBasalt/...
# — this file installs to /etc/vkBasalt.conf; cachy-game seeds a per-user copy
# for Proton/Steam-Runtime games (their container's /etc is its own — same
# reason MangoHud's config is seeded too).
effects = cas

# 0.0 = least sharp/least artefacts (never fully off); 1.0 = maximum. 0.4 is a
# restrained middle value — visible sharpening without haloing on most content.
casSharpness = 0.4

# Toggle the effect at runtime without restarting the game.
toggleKey = Home
enableOnLaunch = True
